[package]
name = "bio_apis"
version = "0.3.1"
edition = "2024"
authors = ["David O'Connor <the_alchemist@fastmail.com>"]
description = "Interact with biology and chemistry databases and APIs"
keywords = ["molecule", "biology", "bioinformatics", "cheminformatics"]
categories = [
    "science::bioinformatics",
    "science::computational-biology::structural-modeling",
    "science::computational-chemistry::cheminformatics",
    "api-bindings"
]
repository = "https://github.com/David-OConnor/bio_apis"
documentation = "https://docs.rs/bio_apis"
readme = "README.md"
license = "MIT"
exclude = [".gitignore"]


[dependencies]
ureq = "3.5"
url = "2.5.8"
webbrowser = "1.2"
na_seq = "0.3.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
serde-aux = "4.7.0"  # Deser num from string.

# For loading a semi-random new protein.
rand = "0.10"
# We use this for decompressing downloaded CIF files.
flate2 = "1.1"
zip = { version = "9.5", default-features = false, features = ["deflate"] }
# For serializing. Useful if storing these to file by the application.
bincode = { version = "2.0.1", optional = true }


[features]
encode = ["bincode"]
